{% extends "base.html" %}

{% block content %}
  <div class="h1 mb-5">
    ToDo List

    <a href="{% url 'core:task-create' %}" class="btn btn-primary link-to-page ">
      Create
    </a>
  </div>
  <ul class="class=list-group-item">
    {% for task in task_list %}
      <div class="list-group">
        <div class="list-group-item list-group-item-action" aria-current="true">
          <div class="d-flex w-100 justify-content-between">
            <h5 class="mb-1">{{ task.content }}</h5>
            <small>{{ task.datetime }}</small>
          </div>
          <small>
            {% for tag in task.tags.all %}
              #{{ tag }}
            {% endfor %}
          </small>
          <p class="mb-1">
            <a href="{% url 'core:task-update' pk=task.id %}">Update </a>
            <a href="{% url 'core:task-delete' pk=task.id %}">Delete</a>
          </p>
        </div>
      </div>


    {% endfor %}
  </ul>
{% endblock %}
