{% extends "base.html" %}

{% block content %}
  <div class="h1 mb-5">
    ToDo List

    <a href="{% url 'core:task-create' %}" class="btn btn-primary link-to-page ">
      Create
    </a>
  </div>
  <ul class="list-group">
    {% for task in task_list %}
      <li class="">{{ task.content }}</li>
      <li>{{ task.datetime }}</li>
      <li>
        Tags: {% for tag in task.tags.all %} {{ tag.name }} {% endfor %}
      </li>
      <li><a href="{% url 'core:task-update' pk=task.id %}">Update</a></li>
      <li><a href="{% url 'core:task-delete' pk=task.id %}">Delete</a></li>
      <hr>
    {% endfor %}
  </ul>
{% endblock %}
